<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6efe0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Secret Script Studio</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <!-- The shared home button: same spot on every screen, hidden on home. -->
    <button id="home-button" type="button" aria-label="Home" hidden>
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M8 23 L24 9 L40 23" />
        <path d="M13 20 V39 H35 V20" />
        <path d="M21 39 V29 H27 V39" />
      </svg>
    </button>
    <!-- The shared mute button: fixed top-right on every screen, home included. -->
    <button id="mute-button" type="button" aria-label="Sound on" aria-pressed="false">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M8 19 H16 L26 10 V38 L16 29 H8 Z" />
        <path class="sound-waves" d="M32 18 Q36 24 32 30 M37 13 Q44 24 37 35" />
        <path class="sound-cross" d="M32 18 L42 30 M42 18 L32 30" />
      </svg>
    </button>
    <main id="screen"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
